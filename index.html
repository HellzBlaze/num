<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arithmetic Raffle Set</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar no-print">
      <h2>Raffle Settings</h2>
      <div class="control-group">
        <label>Operations</label>
        <div class="check-grid">
          <label><input type="checkbox" class="op-check" value="+" checked> +</label>
          <label><input type="checkbox" class="op-check" value="-"> -</label>
          <label><input type="checkbox" class="op-check" value="*"> ×</label>
          <label><input type="checkbox" class="op-check" value="/"> ÷</label>
        </div>
      </div>
      <div class="control-group">
        <label>Mode</label>
        <select id="num-type">
          <option value="whole">Whole Numbers</option>
          <option value="integer">Integers (±)</option>
          <option value="decimal">Decimals</option>
          <option value="fraction">Fractions</option>
        </select>
      </div>
      <div class="control-group">
        <label><input type="checkbox" id="mod-ans" checked> Include Answer Key</label>
      </div>
      <button id="btn-generate" class="primary-btn">Generate Raffle Tickets</button>
      <button onclick="window.print()" class="secondary-btn">Print Cards</button>
    </aside>

    <main class="raffle-board" id="raffle-container">
      </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
