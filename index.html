<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic Raffle - Flip Mode</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --sidebar-bg: #ffffff;
            --card-front: #ffffff;
            --card-back: #f8fafc;
        }

        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f1f5f9; margin: 0; display: flex; }
        
        /* Sidebar */
        .sidebar { 
            width: 320px; height: 100vh; background: var(--sidebar-bg); 
            padding: 1.5rem; border-right: 1px solid #e2e8f0; 
            position: sticky; top: 0; z-index: 10;
        }

        .main-content { flex-grow: 1; padding: 40px; }

        .control-group { margin-bottom: 1.5rem; }
        label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 8px; color: #64748b; }
        
        .op-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-gen { background: var(--primary); color: white; }

        /* Raffle Card Container (3D Context) */
        .raffle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .flip-card {
            background-color: transparent;
            width: 100%;
            height: 220px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        /* The actual flip action */
        .flip-card.is-flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border: 2px dashed #94a3b8;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .card-front { background-color: var(--card-front); color: black; }
        .card-back {
            background-color: var(--card-back);
            color: #334155;
            transform: rotateY(180deg);
            border-style: solid; /* Solid border for the answer side */
        }

        .ticket-id { position: absolute; top: 10px; left: 12px; font-size: 0.65rem; font-weight: 800; color: #94a3b8; }
        .math-box { font-size: 1.6rem; }
        .instruction { font-size: 0.7rem; color: #94a3b8; margin-top: 10px; }

        @media print {
            .sidebar, .instruction { display: none; }
            .flip-card { height: auto; perspective: none; cursor: default; }
            .flip-card-inner { transform: none !important; }
            .card-back { position: relative; transform: none; margin-top: 10px; border-style: dashed; }
            .raffle-grid { display: block; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2>Raffle Settings</h2>
        
        <div class="control-group">
            <label>Operations</label>
            <div class="op-grid">
                <div><input type="checkbox" class="op" value="+" checked> Add</div>
                <div><input type="checkbox" class="op" value="-" checked> Sub</div>
                <div><input type="checkbox" class="op" value="*"> Mult</div>
                <div><input type="checkbox" class="op" value="/"> Div</div>
            </div>
        </div>

        <div class="control-group">
            <label>Number Type</label>
            <select id="num-type">
                <option value="whole">Whole Numbers</option>
                <option value="decimal">Decimals</option>
                <option value="integer">Integers</option>
            </select>
        </div>

        <div class="control-group">
            <label>Complexity (Digits/Places): <span id="digit-val">2</span></label>
            <input type="range" id="digit-range" min="1" max="4" value="2">
        </div >

        <button class="btn-gen" id="generate-btn">Refresh Raffle Set</button>
        <button onclick="window.print()" style="background:#e2e8f0;">Print Cards</button>
        <p style="font-size: 0.75rem; color: #64748b; margin-top: 20px;">
            💡 Click a card to flip and see the answer!
        </p>
    </aside>

    <main class="main-content">
        <div id="raffle-grid" class="raffle-grid"></div>
    </main>

    <script>
        const digitRange = document.getElementById('digit-range');
        const digitVal = document.getElementById('digit-val');
        digitRange.oninput = () => digitVal.textContent = digitRange.value;

        const getRand = (d) => {
            const min = Math.pow(10, d - 1);
            const max = Math.pow(10, d) - 1;
            return Math.floor(Math.random() * (max - min + 1)) + min;
        };

        const renderSet = () => {
            const grid = document.getElementById('raffle-grid');
            grid.innerHTML = '';
            const type = document.getElementById('num-type').value;
            const digits = parseInt(digitRange.value);
            const ops = Array.from(document.querySelectorAll('.op:checked')).map(el => el.value);

            if (ops.length === 0) return alert("Select an operator!");

            for (let i = 1; i <= 12; i++) {
                const op = ops[Math.floor(Math.random() * ops.length)];
                let a, b, mathTex, ansTex;

                if (type === 'decimal') {
                    a = (Math.random() * 50).toFixed(digits);
                    b = (Math.random() * 10).toFixed(digits);
                    mathTex = `${a} ${op === '*' ? '\\times' : op} ${b} = ?`;
                    let res = eval(`${a} ${op === '*' ? '*' : op} ${b}`).toFixed(digits);
                    ansTex = `\\text{Answer:} \\\\ ${res}`;
                } else {
                    a = getRand(digits);
                    b = getRand(Math.max(1, digits - 1));
                    if (type === 'integer' && Math.random() > 0.5) a = -a;
                    mathTex = `${a} ${op === '*' ? '\\times' : op === '/' ? '\\div' : op} ${b} = ?`;
                    ansTex = `\\text{Answer:} \\\\ ${eval(a + (op === '*' ? '*' : op) + b)}`;
                }

                const card = document.createElement('div');
                card.className = 'flip-card';
                card.onclick = () => card.classList.toggle('is-flipped');

                card.innerHTML = `
                    <div class="flip-card-inner">
                        <div class="card-front">
                            <span class="ticket-id">Ticket #${i}</span>
                            <div class="math-box" id="m-${i}"></div>
                            <span class="instruction">Click to reveal</span>
                        </div>
                        <div class="card-back">
                            <div class="math-box" id="a-${i}"></div>
                            <span class="instruction">Click to hide</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);

                katex.render(mathTex, document.getElementById(`m-${i}`));
                katex.render(ansTex, document.getElementById(`a-${i}`));
            }
        };

        document.getElementById('generate-btn').onclick = renderSet;
        window.onload = renderSet;
    </script>
</body>
</html>
